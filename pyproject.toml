[build-system]
requires = ["setuptools==78.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "peercheck"
version = "0.1.0"
description = "Label-efficient sequence segmentation by mutual model verification"
requires-python = ">=3.12"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "Pillow==12.2.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
gpu = ["torch==2.10.0", "torchvision==0.25.0", "transformers==4.57.6", "timm==1.0.28", "einops==0.8.2", "huggingface-hub==0.36.0", "ftfy==6.1.1", "iopath==0.1.10", "opencv-python==4.11.0.86", "hydra-core==1.3.2", "scipy==1.15.3", "pycocotools==2.0.11", "psutil==7.2.2", "setuptools==78.1.0"]

[tool.setuptools.packages.find]
include = ["peercheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
